services:
  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: parchive-onlyoffice
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in your .env}
      JWT_HEADER: Authorization
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_db:/var/lib/postgresql

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_db:
